# Evolution API (WhatsApp) do Jarvis — uso pessoal, acessível só por este PC (127.0.0.1).
# Subir:  docker compose up -d      Parar:  docker compose down   (os dados ficam nos volumes)
name: evolution-whatsapp

services:
  api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    env_file: sistema/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"   # nunca expor na rede: a chave dá acesso total ao seu WhatsApp
    volumes:
      - evolution_instances:/evolution/instances
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: sistema/.env   # usa POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  evolution_instances:
  postgres_data:
  redis_data:

networks:
  interna:
    driver: bridge
